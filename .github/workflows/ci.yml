name: CI

on:
  push:
  pull_request:

jobs:
  pre-commit-validation:
    name: Pre-Commit Validation
    runs-on: ubuntu-latest
    steps:
      - name: Echo
        run: echo "OK"

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Echo
        run: echo "OK"

  bats-full-suite:
    # Informational gate, NOT a merge blocker. Fires on either:
    #   1. direct push to refs/heads/master
    #   2. pull_request closed-merge against base ref master
    # The two-branch if: ensures the regression BATS runs on both
    # manual-merge and auto-merge paths; without the second branch the
    # auto-merge flow emits pull_request.closed with merged: true and
    # would otherwise skip the gate silently.
    name: BATS Full Suite (post-merge)
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'master')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install bats-core (best-effort)
        run: |
          sudo apt-get update >/dev/null 2>&1
          sudo apt-get install -y jq bats parallel >/dev/null 2>&1
          curl -sSL --fail \
            https://codeload.github.com/bats-core/bats-core/tar.gz/master \
            | tar -xz -C /tmp/ bats-core-master/
          /tmp/bats-core-master/install.sh /usr/local

      - name: Run full bats suite (no skip list)
        run: |
          set -uo pipefail
          shopt -s nullglob
          failed=0
          for t in tests/*.bats; do
            [ -f "$t" ] || continue
            bn="$(basename "$t")"
            case "$bn" in *KNOWN-BROKEN.bats) continue ;; esac
            echo "=== $t ==="
            if ! timeout 120 bats "$t" 2>&1; then
              failed=1
            fi
          done
          if [ "${failed}" -ne 0 ]; then
            echo "::error::BATS full suite has regressions."
            exit 1
          fi

      - name: Post regression report to most recent PR
        if: failure()
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: bats-full-suite-headless
          message: |
            BATS full-suite regression detected on this merge.

            Action: run `bats tests/` locally, or bisect with
            `git log --first-parent master` to find the change.
